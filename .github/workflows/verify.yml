name: Verify AlignSec repository

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verifier dependencies
        run: python -m pip install pandas nbformat
      - name: Verify frozen repository
        run: python scripts/verify_repository.py
